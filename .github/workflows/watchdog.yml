name: 同步链停更巡检与自动重启

# 自调度链兜底：每 3 小时检查最近一次巡检记录，超过 26 小时无同步即
#  workflow_dispatch 重启 daily_sync.yml（与既有 x_fetch.yml chain=on 同一思路）。

on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: 检查最近同步时效并按需重启
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            let hours = Infinity, note = '';
            try {
              const {data} = await github.rest.repos.getContent({
                owner, repo, path: 'data/sync_audit.json', ref: 'main'
              });
              const a = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              const runs = (a && a.runs) || [];
              const last = runs.length ? runs[runs.length - 1].at : null;
              if (last) hours = (Date.now() - new Date(last).getTime()) / 3.6e6;
              note = `距上次巡检 ${Number.isFinite(hours) ? hours.toFixed(1) + 'h' : '未知'}`;
            } catch (e) {
              note = '审计文件读取失败: ' + e.message;
            }
            if (!Number.isFinite(hours) || hours > 26) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'daily_sync.yml', ref: 'main',
                inputs: { mode: 'force' }
              });
              core.notice('同步链停更（' + note + '），已自动 workflow_dispatch 重启');
            } else {
              core.info('同步链正常：' + note + '（停更阈值 26h）');
            }
